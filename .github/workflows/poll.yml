name: claxon-poll
on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes (GitHub Actions minimum)
  workflow_dispatch: {}
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger poller
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.POLL_SECRET }}" \
            "${{ vars.APP_URL }}/api/poll"
